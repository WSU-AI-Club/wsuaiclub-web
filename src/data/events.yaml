#   date    optional, year-month-day
#   place   optional
#   type    same list as above
#   role    host (we ran it) or partner (we partnered on it)
#   blurb   optional, one or two short sentences
#   photo   optional, a photo name from src/lib/photo-meta.ts (e.g. chocolathon-opening)
#   photos  optional, a list of photo names: the card becomes a slideshow
#   flyer   optional, a flyer image in src/assets/flyers (name without extension)
#   flyerAlt   optional, what the flyer says, for screen readers
#   link    optional, a full https:// address or a page on this site like /chocolathon
#   linkLabel  optional text for that link
#   facts   optional, up to 4 label/value pairs shown as a data strip

