# EVENTS: everything the Events page and the "Next meeting" strips show.
#
# HOW TO EDIT (in the GitHub web editor, no tools needed)
#   1. Open this file on GitHub and click the pencil icon ("Edit this file").
#   2. To add an event, copy a whole block under `upcoming:` (from the dash to
#      the last line of that event), paste it, and change the values.
#   3. Click "Commit changes". The site rebuilds itself in about a minute.
#   If a value is wrong (a misspelled field, a date like "Oct 14", a time
#   without AM/PM), the rebuild stops, the live site stays as it was, and the
#   error message in Vercel names the event and the field to fix.
#
# UPCOMING EVENT FIELDS
#   title   what it is, the way a student would say it       AI Club Meeting: AI 101
#   date    year-month-day                                    2026-10-28
#   start   12-hour time in Central time, in quotes            "5:00 PM"
#   end     optional, same format                              "8:00 PM"
#   place   building and room, as the building writes it       Woolsey Hall 110A
#   type    one of: meeting, workshop, speaker, build-night, hackathon, social, tabling, other
#   link    optional, usually the ShockerSync event page
#   note    optional, one short line
#
# WHAT VISITORS SEE
#   The site lists only events dated today or later on the day it was built.
#   Every push to GitHub rebuilds the site, so any commit refreshes the list.
#   Each page also hides events that have already ended in the visitor's
#   browser, so a stale entry never shows even between rebuilds.
#   Order does not matter; the site sorts by date and time.
#
# Seeded on 2026-10-12 from the club's ShockerSync listing
# (wichita.campuslabs.com/engage/organization/aiclub/events), times converted
# from UTC to Central. ShockerSync gives no room for the weekly meetings, only
# "Woolsey Hall". It also lists the regular 5:00 PM meeting on Oct 28; AI 101
# is that week's meeting, so only AI 101 is listed here.

