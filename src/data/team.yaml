# TEAM: the people on the Team page and the faces on the home page.
#
# HOW TO EDIT (in the GitHub web editor, no tools needed)
#   1. Open this file on GitHub and click the pencil icon ("Edit this file").
#   2. Change a name or role, or copy a person's block (from the dash to their
#      last line) to add someone. Groups show in the order written here.
#   3. Click "Commit changes". The site rebuilds itself in about a minute.
#   If something is wrong (a misspelled field, a photo that is not there),
#   the rebuild stops, the live site stays as it was, and the error message
#   names the person and the field to fix.
#
# PERSON FIELDS
#   name      as they spell it on LinkedIn
#   role      optional; leave it out rather than guess
#   linkedin  optional, the full https://www.linkedin.com/in/... address
#   bio       optional, one plain line (advisory board page), 24 words or fewer
#   photo     optional, the file name of a square headshot in src/assets/team
#             without ".webp" (e.g. michael-goldberg). Leave it out and the
#             site draws an initials tile. Headshots show in black and white.
#
# To add a headshot: upload a square .webp (256x256 or larger) to
# src/assets/team on GitHub ("Add file" > "Upload files"), then set photo.

